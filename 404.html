<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | PingMeter</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            text-align: center;
            padding: 40px 20px;
        }
        .error-code {
            font-family: var(--font-mono);
            font-size: 8rem;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 40px var(--accent-glow);
            line-height: 1;
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 15px;
        }
        .error-text {
            color: var(--text-muted);
            max-width: 400px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .error-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .error-links a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            padding: 10px 20px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            transition: 0.3s;
        }
        .error-links a:hover {
            background: rgba(0, 240, 255, 0.1);
        }
        @media (max-width: 768px) {
            .error-code { font-size: 5rem; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <!-- HEADER -->
    <header class="glass-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">Ping<span>Meter</span></a>
            <nav id="main-nav">
                <a href="index.html">Test</a>
                <a href="good-speed.html">Good Speed</a>
                <a href="glossary.html">Glossary</a>
                <a href="faq.html">FAQ</a>
                <a href="about.html">About</a>
            </nav>
            <button class="menu-toggle" onclick="document.getElementById('main-nav').classList.toggle('open')">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main class="container">
        <div class="error-page">
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-text">The page you're looking for doesn't exist or has been moved. Your connection seems fine though — maybe test it?</p>
            <div class="error-links">
                <a href="index.html">← Back to Speed Test</a>
                <a href="faq.html">FAQ</a>
                <a href="glossary.html">Glossary</a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="glass-footer">
        <div class="container footer-inner">
            <p>&copy; 2026 PingMeter.org. All rights reserved.</p>
            <div class="footer-links">
                <a href="about.html">About</a>
                <a href="privacy-policy.html">Privacy</a>
                <a href="terms.html">Terms</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
    </footer>
</body>
</html>
